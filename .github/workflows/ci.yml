name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secure_postgres_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          # LỖ HỔNG ĐƯỢC VÁ: Xác định rõ user postgres cho lệnh healthcheck để chống CI false-negative
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"
        
    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        # LỖ HỔNG ĐƯỢC VÁ: Bắt buộc cài đặt với Hash-pinning trên CI để chặn đứng các dependency độc hại
        pip install --require-hashes -r requirements.txt
        pip install --require-hashes -r requirements-dev.txt
        
    - name: Format Check (Black)
      working-directory: ./backend
      run: black --check app tests
      
    - name: Import Sort Check (Isort)
      working-directory: ./backend
      run: isort --check-only app tests
      
    - name: Lint (Flake8)
      working-directory: ./backend
      run: flake8 app tests --max-line-length=88
      
    - name: Security Scan (Bandit)
      working-directory: ./backend
      run: bandit -r app/
      
    - name: Run Tests with Pytest
      working-directory: ./backend
      env:
        PROJECT_NAME: "Backend Setup Project"
        ENVIRONMENT: "testing"
        SECRET_KEY: "super_secret_test_key_for_jwt_auth"
        POSTGRES_USER: "postgres"
        POSTGRES_PASSWORD: "secure_postgres_password"
        POSTGRES_SERVER: "localhost"
        POSTGRES_PORT: "5432"
        POSTGRES_DB: "test_db"
        REDIS_HOST: "localhost"
        REDIS_PORT: "6379"
      run: |
        pytest tests/ --cov=app --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./backend/coverage.xml
        fail_ci_if_error: false
