apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  namespace: backend-prod
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Adds CORS Headers via the Proxy, preventing the CORS Masking Trap
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "PUT, GET, POST, OPTIONS, DELETE, PATCH"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://yourfrontenddomain.com"
    # LỖ HỔNG ĐƯỢC VÁ: Cache OPTIONS Preflight trong 24h để tránh nhân đôi số lượng Request
    nginx.ingress.kubernetes.io/cors-max-age: "86400"
    # LỖ HỔNG ĐƯỢC VÁ: Chặn Public Dashboard/Metrics Leak, trả về 403 nếu cố truy cập /metrics
    nginx.ingress.kubernetes.io/server-snippet: |
      location /metrics {
        deny all;
        return 403;
      }
spec:
  tls:
  - hosts:
    - api.yourdomain.com
    secretName: backend-tls-secret
  rules:
  - host: api.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8000
